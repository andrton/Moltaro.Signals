name: CI

# Runs for every pull request and for every push to main, also when only documents
# changed: the "build" check is required before a merge, and a required check that does
# not run would block the pull request. See docs/work/branches.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

# A test that hangs instead of failing ends its job after 15 minutes instead of GitHub's
# default of six hours (open question Q2 of docs/work/open-questions.md).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet format --verify-no-changes
      - run: dotnet test --configuration Release --no-build

  # The same lane on Windows. Only "build" is a required check of main.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # The same lane on Linux ARM64. Several reads of the library take no lock (the state of
  # a dispose, a completed wait) and work passes between a connection's reader and the
  # thread pool; the memory ordering of x64 hides a class of faults that ARM64 does not,
  # and this job runs the suite where they show. Not a required check of main. A failure
  # here that the other jobs do not show is a finding about the library first and about the
  # test second.
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
